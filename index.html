<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#064e3b">
<title>الاستعلام عن النتيجة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9f5;--card:#fff;--ink:#10231a;--mut:#62786b;--line:#dcebe1;--g1:#0e7a4f;--g2:#064e3b;--g3:#22c55e;--soft:#eaf6ee;--bad:#c0392b;--warn:#b7791f;--info:#2563a8}
@media(prefers-color-scheme:dark){:root{--bg:#09130e;--card:#10201a;--ink:#e9f5ee;--mut:#97b3a3;--line:#1f3a2d;--g1:#34d399;--g3:#4ade80;--soft:#14291f;--bad:#f27a6b;--warn:#f0bd5a;--info:#6fb1ee}.im{filter:invert(1) hue-rotate(180deg)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 Tajawal,system-ui,sans-serif}
.top{position:relative;overflow:hidden;background:linear-gradient(160deg,#064e3b,#0b6b47);color:#fff;text-align:center;padding:calc(34px + env(safe-area-inset-top)) 18px 84px}
.top svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}.top>div{position:relative}
.top h1{margin:0;font:800 1.8rem/1.4 Tajawal}.top p{margin:4px 0 0;opacity:.85}
main{max-width:640px;margin:-56px auto 0;padding:0 14px 36px;position:relative}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 22px rgba(6,78,59,.08)}
.mut{color:var(--mut);font-size:.88rem}h3{font:800 1.05rem Tajawal;margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center}
input{flex:1;min-width:0;font:700 1.6rem Tajawal;letter-spacing:3px;padding:10px 4px;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);direction:ltr;text-align:center;outline:0;border-radius:0}input:focus{border-color:var(--g1)}
button,.btn{font:700 1rem Tajawal;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.go{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:1.08rem}.go:disabled{opacity:.55}
.link{background:var(--soft);color:var(--g1);padding:10px 16px;white-space:nowrap}
.err{color:var(--bad);text-align:center;margin-top:12px;display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:20px 0 0}.tabs button{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:8px 16px;white-space:nowrap}.tabs .on{background:var(--g1);color:#fff;border-color:var(--g1)}
.id{margin-top:22px}.id .nm{font:800 1.35rem/1.5 Tajawal;direction:ltr;text-align:right}.im{display:block;background:#fff;border-radius:8px;padding:3px 8px;max-width:100%;height:auto;margin:6px 0}
.chip{display:inline-block;border-radius:99px;padding:2px 14px;font-weight:700;background:var(--soft);color:var(--g1);margin-top:6px}.chip.no{background:#fde8e3;color:var(--bad)}
.rank{margin:14px 0;padding:14px 18px;border-radius:18px;background:linear-gradient(135deg,#fff7d6,#ffe9a3);color:#5b4200;text-align:center;font:800 1.2rem Tajawal;border:1px solid #f3d36b}.rank small{display:block;font:400 .78rem Tajawal;opacity:.8}
.kpi{display:flex}.k{flex:1;text-align:center}.k b{display:block;font:800 2.6rem/1.2 Tajawal;direction:ltr;color:var(--g1)}.k small{color:var(--mut)}.k+.k{border-right:1px solid var(--line)}
.mini{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem;color:var(--mut)}.mini b{color:var(--ink);direction:ltr;display:inline-block}
.st{display:flex;gap:10px;padding:10px 12px;border-radius:12px;margin-top:8px;font-size:.95rem;background:var(--soft)}.st.bad{background:#fde8e3;color:#7f1d12}.st.warn{background:#fff3d6;color:#6b4a00}.st.info{background:#e3effb;color:#14416e}.st.ok{background:var(--soft);color:var(--g2)}
@media(prefers-color-scheme:dark){.st.bad{background:#3a1713;color:#ffb4a8}.st.warn{background:#3a2d10;color:#f5d58a}.st.info{background:#13283d;color:#a9d0f5}.st.ok{color:#9be3bd}.chip.no{background:#3a1713}}
.course{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.course:last-child{border:0}.ci{flex:1;min-width:0}.ar{font-weight:800;font-size:1.12rem;line-height:1.5}.en{direction:ltr;text-align:right;color:var(--mut);font-size:.85rem}.ci small{color:var(--mut)}
.g{min-width:62px;text-align:center;font:800 1.45rem/1.1 Tajawal;direction:ltr;padding:6px 4px;border-radius:12px}.g small{display:block;font:500 .68rem Tajawal;direction:rtl}
.gA{background:#d8f3e3;color:#0b6b3f}.gB{background:#dcefe9;color:#0b5f56}.gC{background:#fdf0cf;color:#8a5a00}.gD{background:#fde6cf;color:#9a4a00}.gF{background:#fde0da;color:#a52a1b}.gS{background:#e3effb;color:#14416e}.g0{background:var(--line);color:var(--mut)}
@media(prefers-color-scheme:dark){.gA{background:#10331f;color:#7ee2a8}.gB{background:#10302b;color:#7fdacd}.gC{background:#3a2d10;color:#f1c96b}.gD{background:#3a2410;color:#f3b36f}.gF{background:#3a1713;color:#ff9d8e}.gS{background:#13283d;color:#9ccaf3}}
.blocked{margin:14px 0;padding:18px;border-radius:18px;border:1px solid var(--warn);background:#fff3d6;color:#6b4a00;text-align:center;font-weight:700;line-height:2}
.acts{display:grid;gap:10px;margin:14px 0}.acts .btn{padding:16px;flex-direction:column;gap:0}.acts small{font:400 .75rem Tajawal;opacity:.85}.p1{background:var(--g1);color:#fff}.p2{background:var(--card);color:var(--g1);border:2px solid var(--g1)}
details{border-top:1px solid var(--line);padding:12px 0}details:first-child{border:0;padding-top:0}summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between}summary:after{content:"＋";color:var(--g1)}details[open] summary:after{content:"－"}
.imgbox{overflow-x:auto;margin-top:10px;background:#fff;border-radius:8px}.imgbox img{display:block;max-width:none;width:900px;height:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}td,th{padding:7px 3px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--mut);font-weight:500}tfoot td{font-weight:800}
.note{background:var(--soft);border-radius:12px;padding:9px 12px;margin-top:10px;font-size:.85rem}select{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.wr{display:flex;gap:6px;margin:8px 0}.wr select{flex:1}.add{background:none;border:1px dashed var(--g1);color:var(--g1);width:100%;margin-top:6px;padding:11px}
.res{font:800 1.7rem Tajawal;text-align:center;color:var(--g1);direction:ltr;margin-top:10px}
.sym{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}.sym b{min-width:64px;direction:ltr;text-align:left;color:var(--g1)}.sym span{flex:1}.sym i{color:var(--mut);font-style:normal;direction:ltr;font-size:.78rem}
.sha{word-break:break-all;direction:ltr;font-size:.68rem;color:var(--mut);margin-top:8px}footer{text-align:center;color:var(--mut);font-size:.78rem;margin-top:26px}
</style></head><body>
<div class="top"><svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#34d399" stroke-width="1"><path d="M0 40h90l20 20h70M0 90h60l25 25h110l15-15h90M0 170h130l20-20h60M400 30h-80l-20 20h-60M400 120h-100l-20 20h-70M400 190h-90l-25-25h-60M200 0v50l15 15v40M120 220v-40l20-20"/><g fill="#34d399" stroke="none"><circle cx="110" cy="60" r="3"/><circle cx="85" cy="115" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="300" cy="50" r="3"/><circle cx="280" cy="140" r="3"/><circle cx="215" cy="65" r="3"/><circle cx="310" cy="165" r="3"/></g></svg>
<div><h1>الاستعلام عن النتيجة</h1><p>أدخل رقمك الجامعي لعرض نتيجتك</p></div></div>
<main>
<div class="box"><div class="row"><input id="sid" inputmode="numeric" autocomplete="off" placeholder="الرقم الجامعي" maxlength="12"><button class="link" id="pb" type="button">لصق</button></div>
<div id="cf" style="margin-top:8px"></div><button class="go" id="go">فحص النتيجة</button><div class="err" id="err"></div></div>
<div class="mut" style="text-align:center">تُعرض نتيجتك أنت فقط، والمرجع الرسمي هو الملف الأصلي الصادر من الجامعة.</div>
<div id="out"></div><footer>بالتوفيق لكل مجتهد</footer>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dg=s=>s.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776);
const pick=t=>{const r=dg(t||'').match(/\d+/g)||[];return(r.find(x=>x.length>=6)||r[0]||'').slice(0,12)};
window.fit=(e,k)=>{e.style.width=Math.min(e.naturalWidth/4*k,e.parentNode.clientWidth||9999)+'px'};
const SYM={CH:'الساعات المعتمدة (Credit Hours)',GP:'مجموع نقاط الدرجات (Grade Points)',GPA:'المعدل (Grade Point Average)',CGPA:'المعدل التراكمي (Cumulative GPA)'};
const REM={'Excellent':'ممتاز','Very Good':'جيد جداً','Good':'جيد','Pass':'ناجح','Con. Pass':'نجاح مشروط','Fail':'راسب'};
const GR={'A':'ممتاز','A+':'ممتاز','B+':'جيد جداً','B':'جيد','C+':'ناجح','C':'ناجح','D':'نجاح مشروط','F':'راسب','sub':'بديل','Abs.F':'غائب (راسب)'};
const GUIDE=[['التقديرات الخاصة',[['sub','Substitute (excused)','بديل (معفى بعذر): لا تدخل ساعات المادة ودرجتها في معدلك'],['Abs.F','Absent → F','غائب عن الامتحان فيُحتسب راسباً (F)'],['F','Fail','راسب (أقل من 40% أو غياب أو حرمان)'],['D','Conditional Pass','نجاح مشروط'],['Inc','Incomplete','غير مكتمل'],['Bar','Barred','محروم من الامتحان'],['@','Cheating','غش'],['•','Grade after Supplementary','التقدير بعد امتحان الملحق'],['••','Grade after Substitute','التقدير بعد البديل']]],
['الملاحظات في آخر الصف',[['Pas','Pass','ناجح'],['Sup 1F','Supplementary for 1 failed course','ملحق: امتحان تكميلي في مادة واحدة راسب فيها'],['1 Sub','1 Substitute','لديك بديل في مادة واحدة'],['Sup 3F, 1 Sub','','ملحق في 3 مواد، وبديل في مادة واحدة']]],
['الرموز العامة',[['CH','Credit Hours','الساعات المعتمدة'],['GP','Grade Point','نقاط الدرجات (الساعات × قيمة التقدير)'],['GPA','Grade Point Average','المعدل الفصلي/السنوي'],['CGPA','Cumulative GPA','المعدل التراكمي']]],
['الحالة الأكاديمية',[['Pas','Pass','ناجح'],['Prm','Promoted','منقول إلى المستوى التالي'],['Cro','Carry Over','مرحَّل'],['Rpt','Repeated','معيد'],['Rst','Resit','إعادة امتحان'],['Rtk','Retake','إعادة دراسة المقرر'],['Rdo','Redo','إعادة السنة'],['Sup','Supplementary','ملحق (امتحان تكميلي)'],['Sub','Substitute','بديل'],['Sus','Suspension','إيقاف'],['Frz','Freeze','تجميد'],['Crg','Ceased Registration','إيقاف التسجيل'],['Dsc','Discontinued','منقطع'],['Dsm','Dismissed','مفصول'],['Rej','Rejected','مرفوض'],['Rad','Readmitted','معاد قبوله'],['Rrg','Re-registration','إعادة تسجيل']]]];
const nAr=n=>n==1?'مادة واحدة':n==2?'مادتين':n<=10?n+' مواد':n+' مادة';
function remAr(t){return(t||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{let m;if(/^pas$/i.test(x))return'ناجح';if(m=x.match(/^Sup\s*(\d+)\s*F$/i))return'ملحق في '+nAr(+m[1])+' (راسب فيها)';if(m=x.match(/^(\d+)\s*Sub$/i))return'بديل في '+nAr(+m[1]);return x}).join('، ')}
const inp=$('#sid');let cf='',tk='',busy=false,DATA=[];
inp.addEventListener('paste',e=>{e.preventDefault();inp.value=pick((e.clipboardData||window.clipboardData).getData('text'))});
inp.addEventListener('input',()=>{inp.value=dg(inp.value).replace(/\D/g,'').slice(0,12)});
inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('#pb').onclick=async()=>{try{const v=pick(await navigator.clipboard.readText());if(!v)return showErr('لا يوجد رقم في الحافظة.');inp.value=v;go()}catch(e){showErr('تعذّر اللصق التلقائي، اضغط مطولاً على الخانة واختر لصق.');inp.focus()}};
$('#go').onclick=go;const showErr=m=>{const e=$('#err');e.textContent=m;e.style.display=m?'block':'none'};
fetch('/api/config').then(r=>r.json()).then(c=>{if(c.turnstile){tk=c.turnstile;const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?onload=tsReady';s.async=true;document.head.appendChild(s)}});
window.tsReady=()=>turnstile.render('#cf',{sitekey:tk,callback:t=>cf=t});
const ORD=['','الأول','الثاني','الثالث'];
const gcls=g=>!g?'g0':g==='sub'||g==='Abs.F'?(g==='sub'?'gS':'gF'):g[0]==='A'?'gA':g[0]==='B'?'gB':g==='C+'||g==='C'?'gC':g==='D'?'gD':'gF';
async function go(){if(busy)return;showErr('');const id=inp.value;if(!id)return showErr('اكتب الرقم الجامعي أولاً.');
 busy=true;const b=$('#go');b.disabled=true;b.textContent='جارٍ البحث…';$('#out').innerHTML='';
 try{const r=await fetch('/api/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,cf})});const d=await r.json().catch(()=>({}));
  if(!r.ok)showErr(d.error||'حدث خطأ، حاول مرة أخرى.');else{DATA=d.results;show(0);$('#out').scrollIntoView({behavior:'smooth'})}}
 catch(e){showErr('تعذّر الاتصال بالخادم.')}
 if(window.turnstile)turnstile.reset();cf='';busy=false;b.disabled=false;b.textContent='فحص النتيجة'}
function show(i){window.CUR=DATA[i];$('#out').innerHTML=(DATA.length>1?`<div class="tabs">${DATA.map((r,j)=>`<button class="${j==i?'on':''}" onclick="show(${j})">${esc(r.label)}</button>`).join('')}</div>`:'')+render(DATA[i])}
const num=x=>parseFloat(x);
function status(s){const o=[];let bad=0;for(const c of s.courses){const nm=c.name_ar||c.name,t=`«${esc(nm)}» (${esc(c.code)})`;
 if(c.grade==='F'){bad++;o.push(['bad',`راسب في مادة ${t}. عليك امتحان الملحق (Sup) في هذه المادة.`])}
 else if(c.grade==='Abs.F'){bad++;o.push(['bad',`راسب في مادة ${t} بسبب الغياب عن الامتحان (Abs.F). عليك امتحان الملحق في هذه المادة.`])}
 else if(c.grade==='sub')o.push(['info',`لديك بديل (Sub) في مادة ${t}: مادة معفاة بعذر، ولا تدخل ساعاتها ولا درجتها في معدلك لهذا الفصل.`]);
 else if(c.grade==='D')o.push(['warn',`نجاح مشروط (D) في مادة ${t}.`])}
 if(!bad)o.unshift(['ok','ناجح: لا توجد مواد راسب فيها.']);else o.push(['info','مواعيد امتحانات الملحق وشروطها تعلنها الكلية.']);
 return o.map(([k,t])=>`<div class="st ${k}">${t}</div>`).join('')}
function render(r){const s=r.student,g=r.general,sm=k=>s.summary.find(x=>x.key===k&&x.value);
 let h=`<div class="box id"><div class="mut">${esc(r.label)}</div>${r.name_img?`<img class="im" src="${r.name_img}" onload="fit(this,2.6)" alt="الاسم">`:`<div class="nm">${esc(s.name)}</div>`}<div class="mut">رقم الجلوس / الرقم الجامعي: <b dir="ltr" style="color:var(--ink)">${esc(s.id)}</b></div>${r.note_img?`<img class="im" src="${r.note_img}" onload="fit(this,2.1)" alt="">`:s.notes?`<span class="chip ${/Sup|ملحق|رسوب/.test(s.notes)?'no':''}">${esc(remAr(s.notes))}</span>`:''}</div>`;
 if(s.no_result)h+=`<div class="blocked">ربما تم حجب نتيجتك من قبل الإدارة.<br>تواصل مع ليدر الدفعة أو إدارة الجامعة.</div>`;
 else{
  if(r.rank)h+=`<div class="rank">${['🥇','🥈','🥉'][r.rank.n-1]} ترتيبك ${ORD[r.rank.n]} على الدفعة${r.rank.tie?' (مركز مشترك)':''}<small>ترتيب غير رسمي محسوب من معدل الفصل المطبوع</small></div>`;
  const a=sm('sem_gpa'),c=sm('cum_gpa'),big=[a,c].filter(Boolean),lab=x=>SYM[x.label]||x.meaning||x.label;
  h+=`<div class="box">${big.length?`<div class="kpi">${big.map(x=>`<div class="k"><b>${esc(x.value)}</b><small>${esc(x.label==='GPA'||x.label==='CGPA'?SYM[x.label].split(' (')[0]:lab(x))}</small></div>`).join('')}</div>`:''}<div class="mini">${s.summary.filter(x=>x.value&&x!==a&&x!==c).map(x=>`<span>${esc(lab(x).split(' (')[0])} <b>${esc(x.value)}</b></span>`).join('')}</div></div>`;
  h+=`<div class="box"><h3>حالتك الأكاديمية</h3>${status(s)}</div>`;
  h+=`<div class="box"><h3>المقررات والتقديرات</h3>${s.courses.map(c=>`<div class="course"><div class="ci">${r.course_imgs[c.no]?`<img class="im" src="${r.course_imgs[c.no]}" onload="fit(this,2.1)" alt="">`:`<div class="ar">${esc(c.name_ar||c.name)}</div>${c.name_ar&&c.name?`<div class="en">${esc(c.name)}</div>`:''}`}<small dir="ltr">${esc(c.code)}</small> <small>· ${esc(c.hours)} ساعات</small></div><div class="g ${gcls(c.grade)}">${esc(c.grade||'—')}<small>${c.grade?esc(GR[c.grade]||''):'لم تُرصد'}</small></div></div>`).join('')}</div>`;
  h+=calc(r)}
 h+=`<div class="acts"><a class="btn p1" href="${r.links['student.pdf']}">تنزيل نتيجتي مقصوصة من الأصل<small>صفك مع عناوين الجدول فقط</small></a><a class="btn p2" href="${r.links['general.pdf']}">تنزيل نتيجتي مع الأختام والمعلومات<small>الكشف الكامل بدون نتائج زملائك</small></a></div>`;
 const sc=g.scale_info?`<table><tr><th>التقدير</th><th>النقاط</th><th>الدرجة</th><th>المعنى</th></tr>${Object.entries(g.scale).map(([k,v])=>`<tr><td><b dir="ltr">${esc(k)}</b></td><td dir="ltr">${esc(v)}</td><td dir="ltr">${esc((g.scale_info[k]||[''])[0])}</td><td>${esc(REM[(g.scale_info[k]||['',''])[1]]||'')}</td></tr>`).join('')}</table>`:'';
 h+=`<div class="box"><details><summary>تحقق من صفك في الملف الرسمي</summary><div class="mut" style="margin-top:6px">صورة مقصوصة مباشرة من الملف الأصلي. مرّرها يميناً ويساراً.${r.general.meta.scan_deskew_degrees?' (الكشف مصوَّر بالكاميرا؛ عُدّل ميل الصفحة فقط دون أي تغيير آخر).':''}</div><div class="imgbox"><img src="${r.row_img}" alt=""></div><div class="sha">SHA-256: ${esc(r.source.sha256)}</div></details>
 ${sc?`<details><summary>سلم التقديرات</summary>${sc}</details>`:''}
 <details><summary>دليل الرموز والمصطلحات</summary>${GUIDE.map(([t,rows])=>`<h3 style="margin-top:14px">${t}</h3>${rows.map(([k,e,a])=>`<div class="sym"><b>${esc(k)}</b><span>${esc(a)}${e?`<br><i>${esc(e)}</i>`:''}</span></div>`).join('')}`).join('')}</details></div>`;
 return h}
function calc(r){const s=r.student,sc=r.general.scale,pts=g=>sc[g==='Abs.F'?'F':g],cs=s.courses.filter(c=>c.grade&&c.grade!=='sub'&&num(c.hours)&&pts(c.grade)!==undefined);if(!cs.length)return'';
 let H=0,Q=0;const rows=cs.map(c=>{const p=num(pts(c.grade)),hh=num(c.hours);H+=hh;Q+=hh*p;return`<tr><td dir="ltr">${esc(c.code)}</td><td dir="ltr">${esc(c.grade)}</td><td>${hh}</td><td>${p.toFixed(2)}</td><td>${(hh*p).toFixed(2)}</td></tr>`}).join('');
 const printed=s.summary.find(x=>x.key==='sem_gpa'&&x.value),ok=printed&&Math.abs(Q/H-num(printed.value))<=0.011,base=baseOf(s);
 return`<div class="box"><details><summary>كيف حُسب معدلك؟ وحاسبة المعدل</summary><div class="mut" style="margin-top:6px">المعدل = مجموع (نقاط التقدير × ساعات المقرر) ÷ مجموع الساعات. المواد البديلة (sub) لا تدخل في الحساب، والغياب (Abs.F) يُحسب F بصفر نقاط.</div>
 <div style="overflow-x:auto"><table><thead><tr><th>المقرر</th><th>التقدير</th><th>الساعات</th><th>النقاط</th><th>الناتج</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>المجموع</td><td></td><td>${H}</td><td></td><td>${Q.toFixed(2)}</td></tr></tfoot></table></div>
 <div class="res">${Q.toFixed(2)} ÷ ${H} = ${(Q/H).toFixed(2)}</div>
 <div class="note">${ok?'يطابق معدل الفصل المطبوع في الكشف.':`قد يختلف عن المطبوع${printed?' ('+esc(printed.value)+')':''}. <b>المعتمد دائماً هو الرقم الرسمي.</b>`}</div>
 ${base?`<h3 style="margin-top:18px">حاسبة المعدل التراكمي القادم</h3><div class="mut">أضف مواد وتقديرات متوقعة لتعرف معدلك التراكمي التقريبي.</div><div id="wi"></div><button class="add" onclick="addW()">＋ إضافة مادة</button><div class="res" id="wr">—</div>`:''}</details></div>`}
function baseOf(s){const f=k=>{const x=s.summary.find(y=>y.key===k&&y.value);return x?num(x.value):null};let n=f('cum_pts'),h=f('cum_hrs');
 if(n===null||h===null){const gp=f('sem_pts'),ch=f('sem_hrs'),a=f('sem_gpa'),c=f('cum_gpa');if(gp!==null&&ch&&a!==null&&a===c){n=gp;h=ch}else return null}return{n,h}}
function addW(){const sc=CUR.general.scale,g=Object.keys(sc),d=document.createElement('div');d.className='wr';
 d.innerHTML=`<select onchange="calcW()">${[1,2,3,4,5,6].map(n=>`<option ${n==3?'selected':''} value="${n}">${n} ساعات</option>`).join('')}</select><select onchange="calcW()">${g.map(k=>`<option value="${sc[k]}">${k}</option>`).join('')}</select><button class="link" onclick="this.parentNode.remove();calcW()">حذف</button>`;$('#wi').appendChild(d);calcW()}
function calcW(){const{n,h}=baseOf(CUR.student);let a=0,b=0;
 document.querySelectorAll('#wi .wr').forEach(w=>{const x=w.querySelectorAll('select');a+=num(x[0].value)*num(x[1].value);b+=num(x[0].value)});
 $('#wr').textContent=b?`${((n+a)/(h+b)).toFixed(2)}  (الآن ${(n/h).toFixed(2)})`:'—'}
</script></body></html>
